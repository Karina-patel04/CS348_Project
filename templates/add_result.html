<!DOCTYPE html>
<html>
<body>
    <h2>Add New Race Result</h2>
    <form method="POST">
        <label>Athlete:</label>
        <select name="athlete_id">
            {% for a in athletes %}
            <option value="{{ a['athlete_id'] }}">{{ a['name'] }}</option>
            {% endfor %}
        </select><br><br>

        <label>Event:</label>
        <select name="event_id">
            {% for e in events %}
            <option value="{{ e['event_id'] }}">{{ e['name'] }}</option>
            {% endfor %}
        </select><br><br>

        <label>Meet:</label>
        <select name="meet_id">
            {% for m in meets %}
            <option value="{{ m['meet_id'] }}">{{ m['name'] }}</option>
            {% endfor %}
        </select><br><br>

        <label>Time (seconds):</label>
        <input type="number" step="0.01" name="final_time" required><br><br>

        <button type="submit">Save Result</button>
    </form>
    <a href="/">Back to Leaderboard</a>
</body>
</html>
